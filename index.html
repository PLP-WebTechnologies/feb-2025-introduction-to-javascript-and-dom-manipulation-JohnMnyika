<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Assignment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DOM Manipulation Assignment</h1>
        </header>
        
        <main>
            <section class="demo-box">
                <h2>Text Change Example</h2>
                <p id="changeable-text">Original text content that will be changed.</p>
                <button id="change-text-btn">Change Text</button>
            </section>
            
            <section class="demo-box">
                <h2>Style Modification Example</h2>
                <div id="color-box">Color Box</div>
                <button id="change-color-btn">Change Color</button>
                <button id="reset-color-btn">Reset Color</button>
            </section>
            
            <section class="demo-box">
                <h2>Element Toggle Example</h2>
                <button id="toggle-element-btn">Toggle Element</button>
                <div id="toggle-container">
                    <p id="toggled-element">This element will be toggled on and off.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
